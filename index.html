<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Intervalo Musical</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="logo">
🎵
</div>

<h1>Intervalo Musical</h1>

<p class="subtitle">
Escolha até 3 músicas para tocar no intervalo
</p>

<form id="musicForm">

<label>Nome Completo</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome completo"
required>

<label>Turma</label>

<select id="turma" required>

<option value="">
Selecione sua turma
</option>

<option>6º Ano</option>
<option>7º Ano</option>
<option>8º Ano</option>
<option>9º Ano</option>

<option>1º Ano EM</option>
<option>2º Ano EM</option>
<option>3º Ano EM</option>

</select>

<label>Música 1</label>

<input
type="text"
id="musica1"
placeholder="Nome da música"
required>

<label>Música 2</label>

<input
type="text"
id="musica2"
placeholder="Nome da música">

<label>Música 3</label>

<input
type="text"
id="musica3"
placeholder="Nome da música">

<button type="submit">

Enviar Pedido

</button>

</form>

<p id="mensagem"></p>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
