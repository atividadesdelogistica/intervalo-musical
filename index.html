<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🎵 Intervalo Musical</title>

<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#1db954">

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="logo">
🎵
</div>

<h1>Intervalo Musical</h1>

<p class="subtitle">
Escolha até 3 músicas para tocar no intervalo da escola
</p>

<form id="musicForm">

<label>
👤 Nome Completo
</label>

<input
type="text"
id="nome"
placeholder="Digite seu nome completo"
autocomplete="off"
required>

<label>
🏫 Turma
</label>

<select id="turma" required>

<option value="">
Selecione sua turma
</option>

<option>6º Ano</option>
<option>7º Ano</option>
<option>8º Ano</option>
<option>9º Ano</option>

<option>1º Ano EM</option>
<option>2º Ano EM</option>
<option>3º Ano EM</option>

</select>

<label>
🎶 Música 1
</label>

<input
type="text"
id="musica1"
placeholder="Nome da música"
autocomplete="off"
required>

<label>
🎶 Música 2
</label>

<input
type="text"
id="musica2"
placeholder="Nome da música"
autocomplete="off">

<label>
🎶 Música 3
</label>

<input
type="text"
id="musica3"
placeholder="Nome da música"
autocomplete="off">

<button type="submit">

🚀 Enviar Pedido

</button>

</form>

<p id="mensagem"></p>

<div style="
margin-top:25px;
text-align:center;
color:#94a3b8;
font-size:13px;
">

🎧 Suas músicas podem tocar no próximo intervalo.

</div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
