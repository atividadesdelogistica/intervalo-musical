<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🎧 Painel Admin</title>

<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#1db954">

</head>

<body>

<div class="background"></div>

<div class="container">

<div id="loginArea">

<div class="logo">
🎧
</div>

<h1>Painel Admin</h1>

<p class="subtitle">
Acesso restrito à administração
</p>

<input
type="password"
id="senha"
placeholder="Digite a senha">

<button onclick="entrar()">
🔐 Entrar
</button>

<p id="erroSenha"></p>

</div>

<div id="painel" style="display:none;">

<div class="logo">
🎵
</div>

<h1>Pedidos de Música</h1>

<p class="subtitle">
Gerencie os pedidos dos alunos
</p>

<button
class="deleteBtn"
onclick="limparTudo()">

🗑️ Limpar Todos os Pedidos

</button>

<h2 style="
color:white;
margin-top:25px;
margin-bottom:15px;
">

🏆 Ranking das Mais Pedidas

</h2>

<div id="ranking"></div>

<h2 style="
color:white;
margin-top:30px;
margin-bottom:15px;
">

📋 Todos os Pedidos

</h2>

<div id="listaPedidos"></div>

<div style="
margin-top:25px;
text-align:center;
color:#94a3b8;
font-size:13px;
">

🎧 Painel Administrativo - Intervalo Musical

</div>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
